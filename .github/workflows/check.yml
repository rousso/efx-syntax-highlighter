name: Check

# Builds and tests every commit, then syncs again at the pinned commits and fails if a generated
# file differs from the committed one: a forgotten sync, or a sync whose output changed.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Sync at the pinned commits
        run: npm run sync
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generated files match the pinned commits
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
